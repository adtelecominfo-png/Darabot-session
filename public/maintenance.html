<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maintenance — DARATECH BOT V2</title><meta name="robots" content="noindex"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1712;color:#e9f5ee;font-family:Inter,system-ui,sans-serif}.box{width:min(520px,calc(100% - 40px));padding:42px 28px;border:1px solid #294438;border-radius:24px;text-align:center;background:#12231b;box-shadow:0 25px 80px #0005}.logo{width:72px;height:72px;border-radius:20px;object-fit:cover}.eyebrow{margin-top:22px;color:#35d58f;font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}h1{font-size:clamp(32px,8vw,52px);letter-spacing:-.07em;margin:13px 0}p{color:#9bb1a5;line-height:1.65}</style></head><body><main class="box"><img class="logo" src="/assets/apple-touch-icon.png" alt="DARATECH"><div class="eyebrow">Temporarily offline</div><h1 id="title">We'll be right back.</h1><p id="message">DARATECH BOT V2 is currently receiving an update. Please check back shortly.</p></main><script>fetch('/site-config').then(r=>r.json()).then(c=>{document.title='Maintenance — '+c.siteName;document.getElementById('title').textContent=c.siteName+' is taking a short break.';document.getElementById('message').textContent=c.tagline+' We are performing a quick update. Please check back shortly.'}).catch(()=>{});</script></body></html>
