<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DARATECH Admin Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1712;color:#e9f5ee;font-family:Inter,system-ui,sans-serif}.box{width:min(390px,calc(100% - 40px));padding:30px;border:1px solid #294438;border-radius:22px;background:#12231b;box-shadow:0 24px 70px #0005}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.12em}.brand img{width:42px;height:42px;border-radius:13px;object-fit:cover}.eyebrow{margin-top:34px;color:#35d58f;font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}h1{margin:10px 0 8px;font-size:34px;letter-spacing:-.06em}p{color:#9bb1a5;font-size:13px;line-height:1.55}label{display:block;margin:24px 0 7px;color:#9bb1a5;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #294438;border-radius:10px;background:#0c1b14;color:#e9f5ee;outline:0}input:focus{border-color:#35d58f}button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:#35d58f;color:#062415;font-weight:900;cursor:pointer}.error{min-height:18px;margin-top:12px;color:#ff7878;font-size:13px}</style></head><body><main class="box"><div class="brand"><img src="/assets/favicon-64.png" alt="DARATECH"><span>PRIVATE AREA</span></div><div class="eyebrow">Admin access</div><h1>Welcome back.</h1><p>Enter the administrator password to manage the website.</p><form id="loginForm"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Open admin console</button><div class="error" id="error"></div></form></main><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('error');error.textContent='';const r=await fetch('/unknownofrun/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(r.ok) location.href='/unknownofrun/dashboard'; else error.textContent='Incorrect password. Please try again.';});</script></body></html>
